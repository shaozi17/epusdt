<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USD</title>
  <link rel="stylesheet" href="/static/reset.css" />
  <link rel="stylesheet" href="/static/layer/layer.css">
  <style>
    /* 全局 */
    :root {
      --bg: #f3f6f9;
      --card: #ffffff;
      --muted: #8f99a6;
      --accent: #007bff;
      --danger: #e74c3c;
      --shadow: 0 6px 20px rgba(16, 30, 45, 0.06);
      --radius: 12px;
    }

    html, body {
      /* height: 100%; */
      background: linear-gradient(180deg, #eef4fb 0%, var(--bg) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #222;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      margin: 0;
      padding: 0;
    }

    /* 容器 */
    .main {
      max-width: 420px;
      width: calc(100% - 32px);
      margin: 28px auto;
      min-height: calc(100vh - 56px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 100%;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      box-sizing: border-box;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg,#fff,#f2f6fb);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit:cover;
      display:block;
    }

    .site {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .gray-text {
      font-size: 13px;
      text-align: center;
      color: var(--muted);
      line-height: 1.4;
      margin: 0 0 10px;
    }

    .red-text {
      font-size: 13px;
      text-align: center;
      color: var(--danger);
      line-height: 1.4;
      margin: 6px 0 14px;
    }

    /* 二维码卡片 */
    .qr-code-container {
      padding: 18px;
      width: 100%;
      margin: 0 auto 18px;
      background-color: var(--card);
      border-radius: 10px;
      box-sizing: border-box;
    }

    .qr-code-container h2 {
      font-size: 18px;
      text-align: center;
      color: #333;
      margin: 6px 0 12px;
    }

    .qr-code-container h2 small {
      color: var(--muted);
      font-size: 80%;
      padding-left: 6px;
    }

    .address-text {
      font-size: 14px;
      text-align: center;
      color: #1f2937;
      margin: 8px auto 14px;
      word-break: break-all;
      background: #fbfdff;
      border: 1px solid #eef3f8;
      padding: 10px 12px;
      border-radius: 8px;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      transition: box-shadow .15s ease, transform .08s ease;
    }

    .address-text:hover {
      box-shadow: 0 6px 18px rgba(24, 46, 84, 0.06);
      transform: translateY(-1px);
    }

    .address-text:active {
      transform: translateY(0);
    }

    .qr-code {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #f0f3f7;
      margin: 12px auto;
      padding: 12px;
      box-sizing: border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 6px 18px rgba(26, 40, 68, 0.04);
    }

    .qr-code>img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit:contain;
    }

    /* timer */
    .timer {
      width: 100%;
      margin: 8px auto 14px;
      font-size: 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    .timer .value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #222;
      font-size: 18px;
    }

    .timer .value span {
      background: linear-gradient(180deg,#ffffff,#f7fbff);
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 44px;
      text-align:center;
      border:1px solid #eef3f8;
      box-shadow: 0 4px 10px rgba(22, 40, 80, 0.03);
    }

    .timer .label {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
    }

    .timer .label span {
      width: 44px;
      text-align: center;
    }

    /* hash-input 改进样式 */
    .hash-input {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .hash-input label {
      display:block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      width:100%;
    }

    .hash-input .row {
      display:flex;
      gap:8px;
      width:100%;
      align-items:center;
    }

    .hash-input input[type="text"] {
      flex: 1 1 auto;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e6ecf4;
      background: #fbfdff;
      outline: none;
      font-size: 14px;
      color: #1f2937;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      transition: border-color .12s ease, box-shadow .12s ease;
    }

    .hash-input input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(0,123,255,0.08);
    }

    .hash-input button {
      flex: 0 0 110px;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(180deg, var(--accent), #006ad1);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,123,255,0.12);
      transition: transform .08s ease, opacity .12s ease;
    }

    .hash-input button:hover { transform: translateY(-2px); }
    .hash-input button:active { transform: translateY(0); }

    /* 小屏幕自适应 */
    @media (max-width: 420px) {
      .qr-code { width: 180px; height: 180px; padding:10px; }
      .hash-input {
        flex-direction: column;
        align-items: stretch;
      }
      .hash-input .row { flex-direction: column; gap: 10px; }
      .hash-input button { width: 100%; flex: none; }
    }
  </style>
</head>

      <div class="site">
        Order No: {{.TradeId}}
      </div>

      <div class="gray-text" id="network-text">Detecting USDT network...</div>
      <div class="red-text">Click the wallet address or amount to copy👇</div>

      <div class="qr-code-container">
        <p class="address-text" id="copy-token" data-clipboard-text="{{.Token}}">
          {{.Token}}
        </p>

        <div class="qr-code"></div>

        <div class="timer">
          <div class="value">
            <span class="hours">00</span>
            <i>:</i>
            <span class="minutes">00</span>
            <i>:</i>
            <span class="seconds">00</span>
          </div>
          <div class="label">
            <span>H</span>
            <span>m</span>
            <span>s</span>
          </div>
        </div>

        <div class="hash-input">
          <div class="row">
            <input type="text" id="txid" name="txid" placeholder="Enter the transaction hash (TxID)" />
            <button onclick="checkHashOrderStatus()">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/jquery/jquery-3.6.0.min.js"></script>
  <script src="/static/jquery/jquery.qrcode.min.js"></script>
  <script src="/static/clipboard/clipboard.min.js"></script>
  <script src="/static/layer/layer.min.js"></script>
  <script>
    // 支付时间倒计时
    function clock() {
      let timeout = new Date({{.ExpirationTime}});
      let now = new Date();
      let ms = timeout.getTime() - now.getTime();//时间差的毫秒数
      let second = Math.round(ms / 1000);
      let minute = Math.floor(second / 60);
      let hour = Math.floor(minute / 60);
      if(minute > 60) minute %= 60
      if (ms <= 0) {
        layer.alert("Payment timeout, please restart the payment!", {icon: 5});
        return;
      }
      $('.hours').text(hour.toString().padStart(2, '0'));
      $('.minutes').text(minute.toString().padStart(2, '0'));
      $('.seconds').text((second % 60).toString().padStart(2, '0'));
      return setTimeout(clock, 1000);
    }
    setTimeout(clock, 1000);

    $('.qr-code').qrcode({
      text: "{{.Token}}",
      width: 200,
      height: 200,
      foreground: "#000000",
      background: "#ffffff",
      typeNumber: -1
    });

    // 金额复制（保留）
    var copyAmount = new ClipboardJS('#copy-amount');
    if (copyAmount) {
      copyAmount.on('success', function (e) {
        layer.msg('Copy the amount successfully', {icon: 1});
      });
      copyAmount.on('error', function (e) {
        layer.msg('Failed to copy the amount', {icon: 5});
      });
    }

    // 钱包复制
    var copyToken = new ClipboardJS('#copy-token');
    copyToken.on('success', function (e) {
      layer.msg('Copy wallet address successfully', {icon: 1});
    });
    copyToken.on('error', function (e) {
      layer.msg('Failed to copy wallet address', {icon: 5});
    });

    function checkOrderStatus() {
      $.ajax({
        type: "GET",
        dataType: "json",
        url: "/pay/check-status/{{.TradeId}}",
        timeout: 10000,
        success: function (response, status) {
          if (response.data.status == 2) {
            layer.msg('Payment successful, jumping now...', {icon: 16, shade: 0.01, time: 20000});
            window.location.href = {{.RedirectUrl}};
          } else {
            setTimeout("checkOrderStatus()", 2000);
          }
        },
        //Ajax请求超时，继续查询
        error: function (e) {
          setTimeout("checkOrderStatus()", 2000);
        }
      });
    }

    function checkHashOrderStatus() {
      $.ajax({
        type: "GET",
        dataType: "json",
        url: "/pay/check-hash-status/{{.TradeId}}/" + document.getElementById('txid').value,
        timeout: 10000,
        success: function (response, status) {
          layer.msg('Submit successfully, please wait check...');
        },
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      var tokenEl = document.getElementById('copy-token');
      var networkTextEl = document.getElementById('network-text');
      var token = tokenEl ? (tokenEl.getAttribute('data-clipboard-text') || tokenEl.textContent.trim()) : '';
      var network = 'TRC20';
      if (token && token.toLowerCase().startsWith('0x')) network = 'ERC20';
      if (networkTextEl) networkTextEl.textContent = 'The current network is ' + network + '.';
    });
    window.onload = checkOrderStatus();
  </script>
</body>

</html></div>
